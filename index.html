<!doctype html>
<html lang="en">
  <head>

    <meta name="description" content="Turn any MP3 into a YouTube-ready music video with real-time spectrums, AI cover art, and custom branding." />

  <body class="bg-slate-950 text-slate-100 antialiased min-h-screen">
