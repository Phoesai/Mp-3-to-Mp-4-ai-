<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="url(#primaryGrad)" stroke-width="6" stroke-opacity="0.3"/>

  <!-- Audio Wave Bars (Left/Bottom) -->
  <g fill="url(#primaryGrad)" opacity="0.9" filter="url(#glow)">
    <rect x="96" y="270" width="16" height="80" rx="8" />
    <rect x="126" y="230" width="16" height="120" rx="8" />
    <rect x="156" y="190" width="16" height="160" rx="8" />
    <rect x="186" y="250" width="16" height="100" rx="8" />
    <rect x="216" y="210" width="16" height="140" rx="8" />
    <rect x="246" y="160" width="16" height="190" rx="8" />
    <rect x="276" y="220" width="16" height="130" rx="8" />
    <rect x="306" y="180" width="16" height="170" rx="8" />
    <rect x="336" y="240" width="16" height="110" rx="8" />
    <rect x="366" y="200" width="16" height="150" rx="8" />
    <rect x="396" y="260" width="16" height="90" rx="8" />
  </g>

  <!-- Video Play Badge Symbol -->
  <circle cx="256" cy="240" r="88" fill="#0f172a" fill-opacity="0.85" stroke="url(#accentGrad)" stroke-width="8" filter="url(#glow)"/>
  <polygon points="236,200 300,240 236,280" fill="url(#primaryGrad)" />

  <!-- Top Note Accent -->
  <path d="M340 100 Q 360 90 380 110 T 400 150 L 400 190 Q 370 190 360 210 Q 350 230 370 240 Q 390 250 410 230 Q 420 220 420 180 L 420 120 Q 420 90 380 80 Z" fill="url(#accentGrad)" opacity="0.8" />
</svg>
